    <meta name="theme-color" content="#000000" />
    <script>
      // Compatibility shim for browser extensions monkey-patching window networking APIs
      (function() {
        const props = ['WebSocket', 'fetch', 'XMLHttpRequest', 'EventSource'];
        for (const prop of props) {
          try {
            let currentVal = window[prop];
            Object.defineProperty(window, prop, {
              get: function() { return currentVal; },
              set: function(val) { currentVal = val; },
              configurable: true,
              enumerable: true
            });
          } catch (_) {}
        }
      })();
    </script>
